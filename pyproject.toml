[project]
name = "atlas-agents"
version = "1.0.0"
description = "Atlas — équipe d'agents de recherche (cours IAMaestro : Orchestration d'Agents IA)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.13",
  "langgraph>=1.2",
  "mcp>=2.3",
  "pydantic>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
otel = ["opentelemetry-sdk>=1.45"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["langgraph-checkpoint-postgres>=3.1", "psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["atlas"]
